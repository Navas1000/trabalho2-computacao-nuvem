<section class="cartao formulario">
  <a routerLink="/ambientes" class="voltar">← Voltar para ambientes</a>
  <h2>Novo ambiente</h2>

  <form #formulario="ngForm" (ngSubmit)="criar()">
    <label>
      Nome do ambiente
      <input type="text" name="nome" [(ngModel)]="nome" required maxlength="120" />
    </label>

    <div class="linha">
      <label>
        Limite de CPU (%)
        <input type="number" name="cpu" [(ngModel)]="cpuPercentual" required min="0.1" max="6400" step="0.1" />
        <small class="dica">= {{ percentualParaCpu(cpuPercentual || 0) }} millicores (100% = 1 núcleo)</small>
      </label>

      <label>
        Limite de memória (MB)
        <input type="number" name="memoria" [(ngModel)]="memoriaMb" required min="16" max="1048576" step="1" />
      </label>

      <label>
        Limite de I/O (MB/s)
        <input type="number" name="io" [(ngModel)]="ioMbPorSegundo" required min="0.1" step="0.1" />
      </label>
    </div>

    <h3>Script (opcional)</h3>
    <app-seletor-script [(scriptId)]="scriptId" />

    @if (erro()) {
      <p class="mensagem erro">{{ erro() }}</p>
    }

    <button type="submit" [disabled]="formulario.invalid || salvando()">
      {{ salvando() ? 'Criando...' : scriptId() === null ? 'Criar ambiente' : 'Criar ambiente e executar script' }}
    </button>
  </form>
</section>
