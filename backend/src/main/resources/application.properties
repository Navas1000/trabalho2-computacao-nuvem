spring.application.name=backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/compnuvem?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:compnuvem}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=300KB
app.runner-token=${RUNNER_TOKEN}
app.cors-origin=${FRONTEND_ORIGIN:http://localhost:4200}
server.error.include-message=never
