# Site unico: serve o Angular (arquivos estaticos) e encaminha /api para o Spring Boot.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/compnuvem;
    index index.html;
    client_max_body_size 1m;

    # A API interna do runner nunca e exposta ao navegador.
    location /api/runner/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # $http_host preserva a porta (ex.: localhost:8080): o navegador e o backend enxergam a
        # mesma origem, entao o CORS do Spring nao bloqueia as chamadas feitas pelo Angular.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA Angular: rotas do front caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
